name: Hourly Refresh

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"